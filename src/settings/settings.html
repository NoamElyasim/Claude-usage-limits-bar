<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Settings</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ececec; --text: #1d1d1f; --muted: rgba(0,0,0,0.5);
    --seg-bg: rgba(0,0,0,0.07); --seg-on: #ffffff; --seg-shadow: 0 1px 2px rgba(0,0,0,0.18);
    --line: rgba(0,0,0,0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #262628; --text: #f2f2f4; --muted: rgba(255,255,255,0.5);
      --seg-bg: rgba(255,255,255,0.08); --seg-on: rgba(255,255,255,0.2); --seg-shadow: none;
      --line: rgba(255,255,255,0.1);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px -apple-system, 'Segoe UI Variable', 'Segoe UI', sans-serif;
    padding: 22px 24px 18px; user-select: none; cursor: default;
  }
  .row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 12px; }
  .row + .row { margin-top: 22px; }
  label.name { text-align: right; }

  /* Segmented control: three radios styled as one pill. */
  .seg { display: flex; background: var(--seg-bg); border-radius: 7px; padding: 2px; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label {
    flex: 1; text-align: center; padding: 3px 0; border-radius: 5px;
    transition: background-color 0.15s ease;
  }
  .seg input:checked + label { background: var(--seg-on); box-shadow: var(--seg-shadow); }
  .seg input:focus-visible + label { outline: 2px solid AccentColor; outline-offset: 1px; }

  input[type=range] { width: 100%; accent-color: AccentColor; }
  .ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .note { grid-column: 2; color: var(--muted); font-size: 11px; line-height: 1.35; }
  .blur-off .slider { display: none; }
  .blur-on .note { display: none; }

  footer {
    margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line);
    display: flex; justify-content: flex-end;
  }
  button {
    font: inherit; color: var(--text); background: var(--seg-bg);
    border: none; border-radius: 6px; padding: 4px 12px;
  }
  button:active { filter: brightness(0.9); }
</style>
</head>
<body>
  <div class="row">
    <label class="name">Appearance</label>
    <div class="seg" role="radiogroup" aria-label="Appearance">
      <input type="radio" name="appearance" id="ap-system" value="system"><label for="ap-system">System</label>
      <input type="radio" name="appearance" id="ap-dark" value="dark"><label for="ap-dark">Dark</label>
      <input type="radio" name="appearance" id="ap-light" value="light"><label for="ap-light">Light</label>
    </div>
  </div>

  <div class="row" id="blur-row">
    <label class="name" for="blur">Blur</label>
    <div class="slider">
      <input type="range" id="blur" min="0" step="1">
      <div class="ends"><span>Clear</span><span>Heavy</span></div>
    </div>
    <p class="note">Blur strength can't be changed on this system.</p>
  </div>

  <footer><button id="reset">Reset to defaults</button></footer>

<script>
  const blur = document.getElementById('blur');
  const blurRow = document.getElementById('blur-row');

  function show(st) {
    document.getElementById('ap-' + st.appearance).checked = true;
    blur.max = st.blurMax;
    blur.value = st.blur;
    blurRow.className = 'row ' + (st.blurAdjustable ? 'blur-on' : 'blur-off');
  }

  for (const radio of document.querySelectorAll('input[name=appearance]')) {
    radio.addEventListener('change', () => window.settings.set({ appearance: radio.value }));
  }
  // Live while dragging: the widget follows the thumb.
  blur.addEventListener('input', () => window.settings.set({ blur: Number(blur.value) }));
  document.getElementById('reset').addEventListener('click', async () => show(await window.settings.reset()));

  // No menu bar to carry ⌘W, so the page handles it, and Escape like a sheet.
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape' || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'w')) window.settings.close();
  });

  window.settings.get().then(show);
</script>
</body>
</html>
